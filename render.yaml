services:
  - type: web
    name: discord-ai-council
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: discord-ai-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: AI_SECRET_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: ADMIN_ROLE_IDS
        sync: false
      - key: DEFAULT_PROVIDER
        value: gemini
      - key: DEFAULT_MODEL
        value: ""
      - key: PORT
        value: "10000"
      - key: BOT_NAME
        value: AI Council
      - key: USER_COOLDOWN_MS
        value: "4000"
      - key: COUNCIL_COOLDOWN_MS
        value: "12000"
      - key: MAX_CONCURRENT_AI
        value: "4"
databases:
  - name: discord-ai-db
    plan: free
